version: 1
interactions:
  - request:
      method: POST
      url: https://api.anthropic.com/v1/messages
      headers:
        accept: application/json
        accept-encoding: gzip, deflate, zstd
        anthropic-version: '2023-06-01'
        content-type: application/json
        x-api-key: REDACTED
      body:
        json:
          max_tokens: 64
          messages:
            - content: Selam
              role: user
          model: claude-sonnet-4-6
