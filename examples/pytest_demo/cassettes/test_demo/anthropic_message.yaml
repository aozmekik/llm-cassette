      status: 200
      headers:
        content-length: '229'
        content-type: application/json
        request-id: req_demo
      delay_ms: 0.1
      chunks:
        - delay_ms: 0.0
          text: '{"id":"msg_demo","type":"message","role":"assistant","model":"claude-sonnet-4-6","content":[{"type":"text","text":"Echo: Selam"}],"stop_reason":"end_turn","usage":{"input_tokens":20,"cache_read_input_tokens":0,"output_tokens":4}}'
