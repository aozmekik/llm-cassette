version: 1
interactions:
  - request:
      method: POST
      url: https://api.anthropic.com/v1/messages
      headers:
        accept: application/json
        accept-encoding: gzip, deflate, zstd
        anthropic-version: '2023-06-01'
        content-type: application/json
        user-agent: Anthropic/Python 1.15.0
        x-api-key: REDACTED
        x-stainless-arch: arm64
        x-stainless-async: 'false'
        x-stainless-lang: python
        x-stainless-os: MacOS
        x-stainless-package-version: 1.15.0
        x-stainless-read-timeout: '600'
        x-stainless-retry-count: '0'
        x-stainless-runtime: CPython
        x-stainless-runtime-version: 3.14.5
        x-stainless-timeout: '600'
      body:
        json:
          max_tokens: 64
          messages:
            - content: Selam
              role: user
          model: claude-sonnet-4-6
    response:
      status: 200
      headers:
        content-length: '229'
        content-type: application/json
        request-id: req_demo
      delay_ms: 0.1
      chunks:
        - delay_ms: 0.0
          text: '{"id":"msg_demo","type":"message","role":"assistant","model":"claude-sonnet-4-6","content":[{"type":"text","text":"Echo: Selam"}],"stop_reason":"end_turn","usage":{"input_tokens":20,"cache_read_input_tokens":0,"output_tokens":4}}'
