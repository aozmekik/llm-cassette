version: 1
interactions:
  - request:
      method: POST
      url: https://api.openai.com/v1/chat/completions
      headers:
        accept: application/json
        accept-encoding: gzip, deflate, zstd
        authorization: REDACTED
        content-type: application/json
      body:
        json:
          messages:
            - content: akış testi
              role: user
          model: gpt-4o-mini
          stream: true
          stream_options:
            include_usage: true
    response:
      status: 200
      headers:
        content-type: text/event-stream
      delay_ms: 0.1
      complete: false
      chunks:
        - delay_ms: 0.1
          text: |+
            data: {"id": "chatcmpl-demo", "created": 1760000000, "model": "gpt-4o-mini-2024-07-18", "object": "chat.completion.chunk", "usage": null, "choices": [{"index": 0, "delta": {"content": "Echo:"}, "finish_reason": null}]}

        - delay_ms: 1.9
          text: |+
            data: {"id": "chatcmpl-demo", "created": 1760000000, "model": "gpt-4o-mini-2024-07-18", "object": "chat.completion.chunk", "usage": null, "choices": [{"index": 0, "delta": {"content": "akış"}, "finish_reason": null}]}

        - delay_ms: 0.1
          text: |+
            data: {"id": "chatcmpl-demo", "created": 1760000000, "model": "gpt-4o-mini-2024-07-18", "object": "chat.completion.chunk", "usage": null, "choices": [{"index": 0, "delta": {"content": "testi"}, "finish_reason": null}]}

        - delay_ms: 0.1
          text: |+
            data: {"id": "chatcmpl-demo", "created": 1760000000, "model": "gpt-4o-mini-2024-07-18", "object": "chat.completion.chunk", "choices": [], "usage": {"prompt_tokens": 12, "completion_tokens": 3, "total_tokens": 15}}

        - delay_ms: 0.0
          text: |+
            data: [DONE]

